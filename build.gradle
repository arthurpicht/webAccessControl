plugins {
    id 'war'
    id 'maven-publish'
}

group 'de.arthurpicht'
version '0.0.4'
def artifact = 'ap-web-access-control'

repositories {
    maven { url "https://raw.githubusercontent.com/arthurpicht/mvn-repo/main/releases"}
    mavenCentral()
}

dependencies {
    implementation 'de.arthurpicht:ap-utils-core:1.19.0'
    implementation 'ch.qos.logback:logback-classic:1.4.7'

    providedCompile 'jakarta.servlet:jakarta.servlet-api:4.0.2'
    providedCompile 'org.glassfish.jersey.containers:jersey-container-servlet:2.40'
//    implementation 'org.glassfish.jersey.containers:jersey-container-jdk-http:2.30.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
}

java {
    withJavadocJar()
    withSourcesJar()
}

test {
    useJUnitPlatform()
}

base {
    archivesName = artifact
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = artifact
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir(project.gradle.gradleUserHomeDir.parent + "/gitrepos/ap/mvn-repo/releases")
        }
    }
}
